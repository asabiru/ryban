name: Build Free iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-free:
    name: Build Free IPA for Sideloadly
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          XCODE_PATH=""
          for candidate in /Applications/Xcode_16.4.app /Applications/Xcode_16.3.app /Applications/Xcode_16.2.app /Applications/Xcode_16.1.app /Applications/Xcode_16.0.app; do
            if [ -d "$candidate" ]; then XCODE_PATH="$candidate"; break; fi
          done
          if [ -z "$XCODE_PATH" ]; then echo "Xcode 16 or newer is required by the Meta DAT package"; exit 1; fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Free Xcode Project
        run: xcodegen generate --spec project.free.yml

      - name: Resolve Swift Package Dependencies
        run: xcodebuild -resolvePackageDependencies -project RayBanMetaAIFree.xcodeproj

      - name: Build Free Application
        run: |
          xcodebuild clean build \
            -project RayBanMetaAIFree.xcodeproj \
            -scheme RayBanMetaAI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-free \
            META_APP_ID="0" \
            META_CLIENT_TOKEN="0" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Create Free IPA Package
        run: |
          mkdir -p Payload-Free
          cp -r build-free/Build/Products/Release-iphoneos/RayBanMetaAI.app Payload-Free/
          zip -r RayBanMetaAI-Free.ipa Payload-Free

      - name: Upload Free IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RayBanMetaAI-Free-ipa
          path: RayBanMetaAI-Free.ipa
          retention-days: 14
