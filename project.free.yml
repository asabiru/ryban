name: RayBanMetaAIFree
options:
  bundleIdPrefix: com.rayban
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  meta-wearables-dat-ios:
    url: https://github.com/facebook/meta-wearables-dat-ios.git
    from: "0.9.0"

targets:
  RayBanMetaAI:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
    dependencies:
      - package: meta-wearables-dat-ios
        product: MWDATCore
      - package: meta-wearables-dat-ios
        product: MWDATCamera
      - sdk: EventKit.framework
      - sdk: MediaPlayer.framework
      - sdk: CoreLocation.framework
      - sdk: UserNotifications.framework
      - sdk: Security.framework
      - sdk: Speech.framework
      - sdk: AVFoundation.framework
      - sdk: CoreImage.framework
      - sdk: ShazamKit.framework
      - sdk: HomeKit.framework
      - sdk: HealthKit.framework
    settings:
      base:
        PRODUCT_NAME: "RayBanMetaAI"
        PRODUCT_BUNDLE_IDENTIFIER: com.rayban.meta.ai
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        APP_DISPLAY_NAME: "Ray-Ban AI Free"
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "FREE_BUILD"
        DEVELOPMENT_TEAM: "8PGXC4V227"
        META_APP_ID: "1077803035118164"
        META_CLIENT_TOKEN: "AR|1077803035118164|9af3681db3d379371e6244bc004370aa"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
